# 显式固定 Compose 项目名：避免与宿主机上其他 Compose 项目重名而互相接管容器与网络。
name: banner-fingerprint-esp

# 网络拓扑：
#   edge     —— 仅 server 接入，宿主只绑定 127.0.0.1，避免服务暴露到局域网；
#   backend  —— internal: true，仅 server 与 client 互通，禁止访问外网，访问路径收敛为 http://server:8080。
networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

services:
  server:
    build:
      context: .
      target: server
      args:
        VERSION: "1.0.0"
    image: banner-fingerprint-server:1.0.0
    container_name: banner-fingerprint-server
    init: true
    restart: unless-stopped

    environment:
      HTTP_ADDR: ":8080"
      RULES_DIR: "/app/rules"
      GOMAXPROCS: "2"

    # 只绑定回环地址：本机与评测脚本可访问，局域网不可见。
    # 宿主端口与容器内端口一致（8080），便于验收脚本直接访问。
    ports:
      - "127.0.0.1:8080:8080"

    # 规则以只读卷挂载：替换 YAML 后重启容器即生效，无需重建镜像。
    volumes:
      - ./rules:/app/rules:ro

    # ---- 权限与资源收紧 ----
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    pids_limit: 256
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s

    # 真实健康检测：调用服务自身的 /health，而不是检查进程是否存在。
    healthcheck:
      test: ["CMD", "/server", "-healthcheck", "-healthcheck-url", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

    networks:
      - edge
      - backend

  # client 为一次性任务，放在 profile 中，避免默认 up 时容器退出造成误解。
  # 运行方式：docker compose --profile client run --rm client
  client:
    profiles: ["client"]
    build:
      context: .
      target: client
      args:
        VERSION: "1.0.0"
    image: banner-fingerprint-client:1.0.0
    container_name: banner-fingerprint-client
    init: true
    depends_on:
      server:
        condition: service_healthy

    environment:
      FINGERPRINT_SERVER: "http://server:8080"
    command:
      - "-in=/data/input.json"
      - "-server=http://server:8080"
      - "-out=/tmp/results.json"

    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8m,nosuid
    pids_limit: 64
    mem_limit: 64m

    networks:
      - backend
